name: Custom Build

on:
  push:
    branches:
      - custom
  workflow_dispatch:

jobs:
  # Lint + pytest + cargo test + dashboard build. The image is built only if
  # they pass, so every custom-<sha> / custom-latest tag in ghcr.io is a
  # tested one.
  tests:
    uses: ./.github/workflows/custom-tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: ./app/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: ./app/dashboard
        run: VITE_BASE_API=/api/ npm run build --if-present -- --outDir build --assetsDir statics

      - name: Create 404.html
        working-directory: ./app/dashboard
        run: cp ./build/index.html ./build/404.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/noxur05/marzban:custom-latest
            ghcr.io/noxur05/marzban:custom-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
